<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <title>Duskline hero — orange supercar and sport bike chasing down a sunny palm boulevard</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb2ef"/>
      <stop offset="0.55" stop-color="#a8d8f8"/>
      <stop offset="1" stop-color="#ffe3ae"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f7a"/>
      <stop offset="1" stop-color="#3a3d47"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="0.45" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#d63c00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="0.5" stop-color="#2c4a63"/>
      <stop offset="1" stop-color="#0e2233"/>
    </linearGradient>
    <linearGradient id="bikeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.55" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="1420" cy="95" r="130" fill="url(#sun)"/>
  <circle cx="1420" cy="95" r="48" fill="#fff3c4"/>

  <!-- pastel boulevard buildings -->
  <g>
    <rect x="0" y="150" width="180" height="190" fill="#f7a8c4"/>
    <rect x="180" y="185" width="140" height="155" fill="#ffe9b8"/>
    <rect x="320" y="130" width="160" height="210" fill="#9fe8d4"/>
    <rect x="1120" y="160" width="150" height="180" fill="#ffd1a1"/>
    <rect x="1270" y="135" width="170" height="205" fill="#c9b8f2"/>
    <rect x="1440" y="180" width="160" height="160" fill="#f7a8c4"/>
    <g fill="#ffffff" opacity="0.75">
      <rect x="22" y="172" width="24" height="30"/><rect x="66" y="172" width="24" height="30"/><rect x="110" y="172" width="24" height="30"/>
      <rect x="22" y="224" width="24" height="30"/><rect x="66" y="224" width="24" height="30"/><rect x="110" y="224" width="24" height="30"/>
      <rect x="342" y="152" width="24" height="30"/><rect x="386" y="152" width="24" height="30"/><rect x="430" y="152" width="24" height="30"/>
      <rect x="342" y="204" width="24" height="30"/><rect x="386" y="204" width="24" height="30"/><rect x="430" y="204" width="24" height="30"/>
      <rect x="1292" y="157" width="24" height="30"/><rect x="1336" y="157" width="24" height="30"/><rect x="1380" y="157" width="24" height="30"/>
      <rect x="1292" y="209" width="24" height="30"/><rect x="1336" y="209" width="24" height="30"/><rect x="1380" y="209" width="24" height="30"/>
    </g>
    <rect x="0" y="330" width="1600" height="12" fill="#7a5c3e"/>
  </g>

  <!-- palm trees -->
  <g stroke="#5d7a3a" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M120 342 C 112 260, 128 200, 118 140"/>
    <path d="M540 342 C 548 260, 532 200, 544 140"/>
    <path d="M1050 342 C 1042 260, 1058 205, 1048 145"/>
    <path d="M1520 342 C 1512 260, 1528 200, 1518 140"/>
  </g>
  <g fill="#3f7a34">
    <path d="M118 140 C 62 112, 34 130, 16 168 C 62 158, 100 158, 118 140 Z"/>
    <path d="M118 140 C 120 82, 148 54, 190 46 C 162 82, 138 112, 118 140 Z"/>
    <path d="M118 140 C 168 102, 200 106, 222 134 C 180 140, 142 144, 118 140 Z"/>
    <path d="M118 140 C 92 94, 96 62, 118 38 C 124 76, 124 110, 118 140 Z"/>
    <path d="M544 140 C 488 112, 460 130, 442 168 C 488 158, 526 158, 544 140 Z"/>
    <path d="M544 140 C 546 82, 574 54, 616 46 C 588 82, 564 112, 544 140 Z"/>
    <path d="M544 140 C 594 102, 626 106, 648 134 C 606 140, 568 144, 544 140 Z"/>
    <path d="M1048 145 C 992 117, 964 135, 946 173 C 992 163, 1030 163, 1048 145 Z"/>
    <path d="M1048 145 C 1050 87, 1078 59, 1120 51 C 1092 87, 1068 117, 1048 145 Z"/>
    <path d="M1048 145 C 1098 107, 1130 111, 1152 139 C 1110 145, 1072 149, 1048 145 Z"/>
    <path d="M1518 140 C 1462 112, 1434 130, 1416 168 C 1462 158, 1500 158, 1518 140 Z"/>
    <path d="M1518 140 C 1520 82, 1548 54, 1590 46 C 1562 82, 1538 112, 1518 140 Z"/>
  </g>

  <!-- road -->
  <rect x="0" y="342" width="1600" height="298" fill="url(#road)"/>
  <g stroke="#ffd76a" stroke-width="9" stroke-dasharray="70 50" opacity="0.9">
    <line x1="0" y1="520" x2="1600" y2="520"/>
  </g>
  <g stroke="#ffffff" stroke-width="6" opacity="0.35" stroke-linecap="round">
    <line x1="40" y1="400" x2="200" y2="400"/>
    <line x1="1420" y1="400" x2="1570" y2="400"/>
    <line x1="60" y1="600" x2="240" y2="600"/>
  </g>

  <!-- ground shadows -->
  <ellipse cx="580" cy="572" rx="360" ry="20" fill="#000000" opacity="0.35"/>
  <ellipse cx="1150" cy="568" rx="170" ry="15" fill="#000000" opacity="0.35"/>

  <!-- ============ ORANGE SUPERCAR, low-wide, 3/4 front, facing left ============ -->
  <g>
    <!-- main body: long low nose to the left, cabin, haunches to the right -->
    <path d="M250 520 L 262 462 Q 272 428 322 414 L 470 384 Q 560 362 650 366 L 770 388 Q 880 406 908 452 L 922 500 Q 928 522 884 526 L 300 526 Q 250 526 250 520 Z" fill="url(#carBody)"/>
    <!-- hood highlight -->
    <path d="M280 452 Q 400 408 540 392 L 640 378 Q 720 392 780 430 L 800 462 Q 520 470 280 452 Z" fill="#ff8c1a" opacity="0.55"/>
    <!-- front fascia: the 3/4 face turning toward the viewer -->
    <path d="M250 520 L 262 462 Q 268 440 300 432 L 330 428 L 322 520 Q 280 528 250 520 Z" fill="#e04a00"/>
    <path d="M258 470 L 318 452 L 314 486 L 260 498 Z" fill="#1a0d05"/>
    <!-- headlights -->
    <path d="M272 448 L 332 434 L 328 458 L 274 468 Z" fill="#fff6c8"/>
    <path d="M340 428 L 392 420 L 388 442 L 342 448 Z" fill="#fff6c8" opacity="0.85"/>
    <!-- cabin + windshield -->
    <path d="M480 388 L 540 340 Q 556 328 590 330 L 690 348 Q 736 360 740 384 L 736 396 L 480 396 Z" fill="url(#glass)"/>
    <path d="M556 338 L 600 334 L 616 388 L 566 390 Z" fill="#dff4ff" opacity="0.5"/>
    <!-- side window -->
    <path d="M636 340 L 706 354 L 716 384 L 636 388 Z" fill="#16324a"/>
    <!-- side air intake -->
    <path d="M742 428 L 840 446 L 828 492 L 742 478 Z" fill="#1a0d05"/>
    <!-- door line + handle -->
    <path d="M520 398 L 520 516 M 640 398 L 640 516" stroke="#b33200" stroke-width="4" opacity="0.6"/>
    <rect x="556" y="428" width="42" height="9" rx="4" fill="#7a1e00"/>
    <!-- front splitter + rear wing -->
    <path d="M250 520 L 262 498 L 922 498 L 918 522 Z" fill="#1a0d05"/>
    <path d="M862 414 L 922 404 L 926 424 L 866 430 Z" fill="#d63c00"/>
    <!-- wheels -->
    <g>
      <circle cx="380" cy="512" r="56" fill="#0c0d12"/>
      <circle cx="380" cy="512" r="34" fill="#2c2f38"/>
      <circle cx="380" cy="512" r="34" fill="none" stroke="#c8ccd6" stroke-width="5"/>
      <g stroke="#c8ccd6" stroke-width="6" stroke-linecap="round">
        <line x1="380" y1="482" x2="380" y2="542"/>
        <line x1="350" y1="512" x2="410" y2="512"/>
        <line x1="359" y1="491" x2="401" y2="533"/>
        <line x1="401" y1="491" x2="359" y2="533"/>
      </g>
      <circle cx="380" cy="512" r="9" fill="#ff6a00"/>
      <circle cx="800" cy="512" r="56" fill="#0c0d12"/>
      <circle cx="800" cy="512" r="34" fill="#2c2f38"/>
      <circle cx="800" cy="512" r="34" fill="none" stroke="#c8ccd6" stroke-width="5"/>
      <g stroke="#c8ccd6" stroke-width="6" stroke-linecap="round">
        <line x1="800" y1="482" x2="800" y2="542"/>
        <line x1="770" y1="512" x2="830" y2="512"/>
        <line x1="779" y1="491" x2="821" y2="533"/>
        <line x1="821" y1="491" x2="779" y2="533"/>
      </g>
      <circle cx="800" cy="512" r="9" fill="#ff6a00"/>
    </g>
    <!-- speed streaks off the car -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="950" y1="420" x2="1050" y2="420"/>
      <line x1="960" y1="480" x2="1070" y2="480"/>
    </g>
  </g>

  <!-- ============ SPORT BIKE + RIDER, facing left, matching scale ============ -->
  <g>
    <!-- wheels -->
    <circle cx="1010" cy="532" r="48" fill="#0c0d12"/>
    <circle cx="1010" cy="532" r="48" fill="none" stroke="#8a8f9c" stroke-width="4"/>
    <circle cx="1010" cy="532" r="27" fill="none" stroke="#c8ccd6" stroke-width="5"/>
    <circle cx="1210" cy="532" r="48" fill="#0c0d12"/>
    <circle cx="1210" cy="532" r="48" fill="none" stroke="#8a8f9c" stroke-width="4"/>
    <circle cx="1210" cy="532" r="27" fill="none" stroke="#c8ccd6" stroke-width="5"/>
    <g stroke="#c8ccd6" stroke-width="5" stroke-linecap="round">
      <line x1="1010" y1="506" x2="1010" y2="558"/><line x1="984" y1="532" x2="1036" y2="532"/>
      <line x1="1210" y1="506" x2="1210" y2="558"/><line x1="1184" y1="532" x2="1236" y2="532"/>
    </g>
    <!-- frame + fairing -->
    <path d="M1010 532 L 1085 452 L 1155 438 L 1210 532" fill="none" stroke="#16181f" stroke-width="11" stroke-linejoin="round"/>
    <path d="M1085 452 L 1128 414 L 1180 414 L 1200 452 L 1158 466 L 1100 470 Z" fill="url(#bikeBody)"/>
    <!-- red tank + tail -->
    <path d="M1100 452 Q 1138 420 1180 424 L 1190 452 Q 1148 466 1100 452 Z" fill="#d21f2b"/>
    <path d="M986 494 L 1042 480 L 1052 504 L 1000 514 Z" fill="#d21f2b"/>
    <!-- front fork + handlebar -->
    <line x1="1180" y1="414" x2="1214" y2="472" stroke="#c8ccd6" stroke-width="8" stroke-linecap="round"/>
    <line x1="1190" y1="400" x2="1228" y2="394" stroke="#16181f" stroke-width="8" stroke-linecap="round"/>
    <!-- headlight -->
    <path d="M1182 432 L 1206 424 L 1210 444 L 1186 448 Z" fill="#fff6c8"/>
    <!-- rider: leaning forward, black leathers, red helmet -->
    <g>
      <path d="M1108 434 Q 1090 396 1114 368 L 1142 358 Q 1170 368 1166 400 L 1152 434 Z" fill="#16181f"/>
      <circle cx="1148" cy="346" r="24" fill="#d21f2b"/>
      <path d="M1130 338 Q 1148 324 1166 338 L 1164 350 L 1134 350 Z" fill="#1a1a1a"/>
      <path d="M1112 434 L 1084 490 L 1102 498 L 1130 438 Z" fill="#16181f"/>
      <path d="M1150 434 L 1184 476 L 1198 464 L 1170 430 Z" fill="#16181f"/>
      <path d="M1136 396 L 1180 414 L 1184 428 L 1140 412 Z" fill="#16181f"/>
    </g>
    <!-- speed streaks -->
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="1252" y1="452" x2="1300" y2="452"/>
      <line x1="1252" y1="508" x2="1292" y2="508"/>
    </g>
  </g>

  <!-- warm golden-hour wash over the whole scene -->
  <rect width="1600" height="640" fill="#ff9a1e" opacity="0.08"/>
  <rect width="1600" height="640" fill="#ffcf5e" opacity="0.05"/>
</svg>
