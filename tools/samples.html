<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VICE PURSUIT sample scenes</title></head>
<body>
<canvas id="c" width="1600" height="1000"></canvas>
<script>
// VICE PURSUIT — in-session sample scenes (rebuild r7).
// Eight distinct canvas paintings, one hero + one atmosphere/weather each.
// Drawn here in the recording, saved as app/samples/*.jpg by
// tools/render-samples.mjs. Deterministic: seeded random, fixed palettes.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1600, H = 1000;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sky(stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function glowSun(x, y, r, core, halo) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  g.addColorStop(0, halo);
  g.addColorStop(0.4, halo.replace(/[\d.]+\)$/, '0.35)'));
  g.addColorStop(1, halo.replace(/[\d.]+\)$/, '0)'));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function clouds(rnd, n, y0, y1, color, alpha) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = y0 + rnd() * (y1 - y0), s = 40 + rnd() * 130;
    ctx.beginPath();
    ctx.ellipse(x, y, s, s * 0.32, 0, 0, Math.PI * 2);
    ctx.ellipse(x + s * 0.5, y + 6, s * 0.7, s * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function birds(rnd, n, y0, y1) {
  ctx.save();
  ctx.strokeStyle = 'rgba(20,10,30,0.75)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = y0 + rnd() * (y1 - y0), s = 8 + rnd() * 14;
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.quadraticCurveTo(x - s * 0.4, y - s * 0.7, x, y);
    ctx.quadraticCurveTo(x + s * 0.4, y - s * 0.7, x + s, y);
    ctx.stroke();
  }
  ctx.restore();
}

function palm(x, y, s, lean, dark) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean || 0);
  ctx.scale(s, s);
  ctx.strokeStyle = dark || '#2c1a0e';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(18, -90, 6, -190);
  ctx.stroke();
  ctx.lineWidth = 9;
  const fronds = [[-1.5, -0.5], [-1.1, -0.9], [-0.4, -1.15], [0.4, -1.1], [1.1, -0.85], [1.5, -0.4], [-0.9, -1.25], [0.9, -1.2]];
  for (const [dx, dy] of fronds) {
    ctx.beginPath();
    ctx.moveTo(6, -190);
    ctx.quadraticCurveTo(6 + dx * 70, -190 + dy * 70, 6 + dx * 130, -190 + dy * 110 + 55);
    ctx.stroke();
  }
  ctx.fillStyle = dark ? dark : '#3a2412';
  ctx.beginPath(); ctx.arc(6, -190, 16, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-8, -178, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -176, 10, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function rain(rnd, n, color) {
  ctx.save();
  ctx.strokeStyle = color || 'rgba(200,220,255,0.45)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, len = 26 + rnd() * 40;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - len * 0.18, y + len);
    ctx.stroke();
  }
  ctx.restore();
}

function building(x, y, w, h, rnd, lit) {
  ctx.fillStyle = '#0d0a1a';
  ctx.fillRect(x, y, w, h);
  const cols = Math.floor(w / 26), rows = Math.floor(h / 34);
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      if (rnd() > 0.55) continue;
      const warm = rnd() > 0.5;
      ctx.fillStyle = warm ? `rgba(255,190,90,${0.5 + rnd() * 0.5})` : `rgba(120,220,255,${0.4 + rnd() * 0.5})`;
      ctx.fillRect(x + 8 + i * 26, y + 10 + j * 34, 13, 18);
    }
  }
  ctx.fillStyle = lit || 'rgba(255,46,136,0.9)';
  ctx.fillRect(x, y - 6, w, 6);
}

// ---------------------------------------------------------------- vehicles

function wheel(x, y, r, rim) {
  ctx.fillStyle = '#0a0a0c';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rim || '#c8ccd4';
  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1e';
  ctx.beginPath(); ctx.arc(x, y, r * 0.30, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const a = (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r * 0.58, y + Math.sin(a) * r * 0.58);
    ctx.stroke();
  }
}

/** Mix a #rrggbb colour toward white (f>0) or black (f<0). */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = (v) => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

/** Low angular supercar, side profile. x,y = ground centre, s = length. */
function sportsCar(x, y, s, body, glass) {
  const u = s / 640;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(u, u);
  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 6, 300, 16, 0, 0, Math.PI * 2); ctx.fill();
  // Body: angular wedge, bright metallic highlight along the shoulder
  const grad = ctx.createLinearGradient(-300, -120, 300, 0);
  grad.addColorStop(0, shade(body, -0.25));
  grad.addColorStop(0.35, body);
  grad.addColorStop(0.55, shade(body, 0.55));
  grad.addColorStop(0.75, body);
  grad.addColorStop(1, shade(body, -0.35));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-310, -18);
  ctx.lineTo(-268, -58);
  ctx.lineTo(-150, -72);
  ctx.lineTo(-96, -128);
  ctx.lineTo(58, -132);
  ctx.lineTo(150, -78);
  ctx.lineTo(288, -62);
  ctx.lineTo(312, -30);
  ctx.lineTo(300, -8);
  ctx.lineTo(-300, -8);
  ctx.closePath();
  ctx.fill();
  // Glass canopy
  ctx.fillStyle = glass || 'rgba(12,18,34,0.92)';
  ctx.beginPath();
  ctx.moveTo(-88, -118);
  ctx.lineTo(50, -122);
  ctx.lineTo(128, -76);
  ctx.lineTo(-138, -76);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath();
  ctx.moveTo(-60, -116);
  ctx.lineTo(-10, -118);
  ctx.lineTo(-40, -80);
  ctx.lineTo(-80, -80);
  ctx.closePath();
  ctx.fill();
  // Side intake + skirt
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.moveTo(120, -52); ctx.lineTo(240, -52); ctx.lineTo(252, -18); ctx.lineTo(128, -18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(-300, -12, 600, 8);
  // Headlight: sharp LED slash + short beam
  ctx.fillStyle = '#fff6c8';
  ctx.beginPath();
  ctx.moveTo(-306, -46); ctx.lineTo(-252, -56); ctx.lineTo(-268, -34); ctx.lineTo(-304, -30);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,150,0.35)';
  ctx.beginPath();
  ctx.moveTo(-306, -40); ctx.lineTo(-380, -22); ctx.lineTo(-380, 2); ctx.lineTo(-300, -14);
  ctx.closePath(); ctx.fill();
  // Taillight
  ctx.fillStyle = '#ff2e3e';
  ctx.fillRect(284, -52, 22, 10);
  wheel(-196, -6, 52);
  wheel(196, -6, 52);
  ctx.restore();
}

/** Black-and-white interceptor with a flashing light bar. */
function policeCar(x, y, s) {

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 8, 290, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8e8ec';
  ctx.beginPath();
  ctx.moveTo(-300, -14);
  ctx.lineTo(-272, -52);
  ctx.lineTo(-150, -64);
  ctx.lineTo(-100, -118);
  ctx.lineTo(60, -120);
  ctx.lineTo(150, -70);
  ctx.lineTo(292, -56);
  ctx.lineTo(306, -26);
  ctx.lineTo(296, -8);
  ctx.lineTo(-296, -8);
  ctx.closePath(); ctx.fill();
  // Black hood + trunk
  ctx.fillStyle = '#14141a';
  ctx.beginPath();
  ctx.moveTo(-300, -14); ctx.lineTo(-272, -52); ctx.lineTo(-150, -64); ctx.lineTo(-140, -14);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(150, -70); ctx.lineTo(292, -56); ctx.lineTo(306, -26); ctx.lineTo(296, -8);
  ctx.lineTo(170, -8); ctx.closePath(); ctx.fill();
  // Glass
  ctx.fillStyle = 'rgba(10,16,30,0.95)';
  ctx.beginPath();
  ctx.moveTo(-92, -108); ctx.lineTo(52, -110); ctx.lineTo(126, -68); ctx.lineTo(-132, -68);
  ctx.closePath(); ctx.fill();
  // Light bar: red left, blue right, with glow
  ctx.fillStyle = '#ff2038';
  ctx.fillRect(-34, -138, 30, 16);
  ctx.fillStyle = '#2266ff';
  ctx.fillRect(6, -138, 30, 16);
  ctx.fillStyle = 'rgba(255,32,56,0.45)';
  ctx.beginPath(); ctx.arc(-19, -130, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(34,102,255,0.45)';
  ctx.beginPath(); ctx.arc(21, -130, 46, 0, Math.PI * 2); ctx.fill();
  // Door badge
  ctx.fillStyle = '#14141a';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('POLICE', 0, -34);
  wheel(-190, -6, 50);
  wheel(190, -6, 50);
  ctx.restore();
}

/** Sport bike with a leaning rider, side profile. x,y = ground centre. */
function sportBike(x, y, s, body, riderJacket) {
  const u = s / 420;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(u, u);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 4, 210, 12, 0, 0, Math.PI * 2); ctx.fill();
  wheel(-140, -34, 46);
  wheel(140, -34, 46);
  // Frame + fairing
  ctx.fillStyle = body || '#15151c';
  ctx.beginPath();
  ctx.moveTo(-150, -60);
  ctx.lineTo(-60, -120);
  ctx.lineTo(60, -128);
  ctx.lineTo(170, -70);
  ctx.lineTo(150, -30);
  ctx.lineTo(40, -44);
  ctx.lineTo(-60, -40);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.moveTo(60, -124); ctx.lineTo(120, -96); ctx.lineTo(90, -60); ctx.lineTo(40, -90);
  ctx.closePath(); ctx.fill();
  // Red accents
  ctx.fillStyle = '#d92038';
  ctx.beginPath();
  ctx.moveTo(120, -96); ctx.lineTo(168, -72); ctx.lineTo(150, -44); ctx.lineTo(104, -64);
  ctx.closePath(); ctx.fill();
  // Headlight
  ctx.fillStyle = '#fff6c8';
  ctx.beginPath();
  ctx.moveTo(168, -78); ctx.lineTo(186, -70); ctx.lineTo(172, -52); ctx.lineTo(156, -60);
  ctx.closePath(); ctx.fill();
  // Rider: leaning torso, helmet, arm to bars, leg to peg
  ctx.fillStyle = riderJacket || '#1c1c22';
  ctx.beginPath();
  ctx.moveTo(-40, -110);
  ctx.quadraticCurveTo(10, -170, 70, -158);
  ctx.quadraticCurveTo(96, -140, 78, -112);
  ctx.quadraticCurveTo(20, -96, -40, -110);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#101014';
  ctx.beginPath(); ctx.arc(88, -176, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(160,220,255,0.85)';
  ctx.beginPath(); ctx.arc(98, -180, 16, -0.6, 1.2); ctx.fill();
  ctx.strokeStyle = '#1c1c22';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(66, -150); ctx.lineTo(150, -96); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, -104); ctx.lineTo(-30, -44); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------- more figures

  const grad = ctx.createLinearGradient(-300, -100, 300, 0);
  grad.addColorStop(0, shade(body, -0.2));
  grad.addColorStop(0.35, body);
  grad.addColorStop(0.55, shade(body, 0.5));
  grad.addColorStop(1, shade(body, -0.3));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-310, -16);
  ctx.lineTo(-270, -50);
  ctx.lineTo(-160, -58);
  ctx.lineTo(60, -58);
  ctx.lineTo(180, -52);
  ctx.lineTo(300, -34);
  ctx.lineTo(306, -8);
  ctx.lineTo(-300, -8);
  ctx.closePath(); ctx.fill();
  // Interior + seats + driver head
  ctx.fillStyle = '#1c1410';
  ctx.fillRect(-150, -58, 210, 22);
  ctx.fillStyle = '#3a2a1c';
  ctx.fillRect(-120, -78, 34, 24);
  ctx.fillStyle = '#c89a6a';
  ctx.beginPath(); ctx.arc(-60, -76, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1a10';
  ctx.beginPath(); ctx.arc(-60, -82, 20, Math.PI, 0); ctx.fill();

  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.ellipse(-288, -34, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';

  grad.addColorStop(0.25, body);
  grad.addColorStop(1, shade(body, -0.3));

  ctx.moveTo(-310, -12);
  ctx.lineTo(-300, -56);
  ctx.lineTo(-180, -66);
  ctx.lineTo(-140, -116);
  ctx.lineTo(60, -116);
  ctx.lineTo(120, -66);
  ctx.lineTo(300, -58);
  ctx.lineTo(310, -16);
  ctx.lineTo(300, -8);
  ctx.lineTo(-300, -8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(12,18,34,0.92)';
  ctx.beginPath();
  ctx.moveTo(-128, -104); ctx.lineTo(48, -104); ctx.lineTo(96, -64); ctx.lineTo(-152, -64);

/** Helicopter with a searchlight beam. */
function helicopter(x, y, s) {
  const u = s / 520;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(u, u);
  // Searchlight beam
  ctx.fillStyle = 'rgba(255,244,180,0.16)';
  ctx.beginPath();
  ctx.moveTo(-40, 30);
  ctx.lineTo(-260, 320);
  ctx.lineTo(180, 320);
  ctx.lineTo(40, 30);
  ctx.closePath(); ctx.fill();
  // Rotor
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(-260, -108, 520, 10);
  ctx.fillRect(-8, -108, 16, 40);
  // Body
  ctx.fillStyle = '#22222c';
  ctx.beginPath();
  ctx.moveTo(-200, -60);
  ctx.quadraticCurveTo(-160, -96, -60, -96);
  ctx.lineTo(80, -96);
  ctx.quadraticCurveTo(180, -90, 190, -40);
  ctx.lineTo(150, 0);
  ctx.lineTo(-160, 0);
  ctx.closePath(); ctx.fill();

  building(890, 430, 200, 370, rnd, 'rgba(34,211,238,0.9)');
  building(1120, 360, 170, 440, rnd);
  building(1320, 470, 280, 330, rnd);
  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 90; i++) ctx.fillRect(rnd() * W, rnd() * 300, 2, 2);
  // Rooftop foreground
  ctx.fillStyle = '#0b0816';
  ctx.beginPath(); ctx.moveTo(0, 800); ctx.lineTo(W, 780); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#171226';
  ctx.fillRect(0, 780, W, 14);
  // Rooftop props: AC unit + antenna
  ctx.fillStyle = '#1c1730';
  ctx.fillRect(120, 700, 180, 82);
  ctx.fillRect(1300, 720, 150, 62);
  ctx.strokeStyle = '#2a2344';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(1420, 720); ctx.lineTo(1420, 560); ctx.stroke();
  ctx.fillStyle = '#ff2e3e';
  ctx.beginPath(); ctx.arc(1420, 556, 8, 0, Math.PI * 2); ctx.fill();
  // Helicopter, centre, searchlight sweeping the roof
  helicopter(780, 520, 520);
}

/** 8 — Misty dawn fishing pier: boat + fisherman, pale fog. */
function scenePier() {
  const rnd = mulberry32(808);
  sky([[0, '#f2d8c8'], [0.45, '#e8b8a0'], [0.7, '#c98a90'], [1, '#8a6a80']]);
  glowSun(1180, 300, 66, '#fff2d8', 'rgba(255,220,170,0.8)');
  // Calm water
  const sea = ctx.createLinearGradient(0, 560, 0, H);
  sea.addColorStop(0, '#d9a08e');
  sea.addColorStop(0.5, '#a87a88');
  sea.addColorStop(1, '#6a5470');
  ctx.fillStyle = sea;
  ctx.fillRect(0, 560, W, 440);
  ctx.fillStyle = 'rgba(255,240,220,0.35)';
  for (let i = 0; i < 24; i++) {
    const x = rnd() * W, y = 580 + rnd() * 380, w = 70 + rnd() * 200;
    ctx.fillRect(x, y, w, 3);
  }
  // Small boat with a fisherman silhouette
  ctx.fillStyle = '#3a2a30';
  ctx.beginPath();
  ctx.moveTo(950, 640); ctx.lineTo(1250, 640); ctx.lineTo(1210, 672); ctx.lineTo(990, 672);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(1080, 600, 10, 44);
  ctx.fillStyle = 'rgba(58,42,48,0.9)';
  ctx.beginPath(); ctx.arc(1100, 596, 12, 0, Math.PI * 2); ctx.fill();
  // Wooden pier, diagonal from the left
  ctx.save();
  ctx.translate(0, 0);
  ctx.fillStyle = '#5a4030';
  ctx.beginPath();
  ctx.moveTo(0, 700); ctx.lineTo(760, 620); ctx.lineTo(760, 700); ctx.lineTo(0, 860);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6e4f3a';
  for (let i = 0; i < 12; i++) {
    const t = i / 11;
    const x0 = t * 760, y0 = 700 - t * 80;
    ctx.fillRect(x0, y0, 10, 150);
  }
  ctx.fillStyle = '#3a2a20';
  for (const px of [120, 380, 640]) {
    ctx.fillRect(px, 700, 18, 200);
  }
  ctx.restore();
  // Fisherman at the pier end
  fisherman(700, 640, 360);
  // Fog layers
  ctx.fillStyle = 'rgba(242,216,200,0.28)';
  ctx.fillRect(0, 520, W, 90);
  ctx.fillStyle = 'rgba(242,216,200,0.22)';
  ctx.fillRect(0, 760, W, 120);
  birds(rnd, 6, 140, 300);
}

// ---------------------------------------------------------------- export

const SCENES = {
  chase: sceneChase,
  neon: sceneNeon,
  beach: sceneBeach,
  rain: sceneRain,
  desert: sceneDesert,
  harbor: sceneHarbor,
  rooftop: sceneRooftop,
  pier: scenePier,
};

/** Draw one scene and return a JPEG data URL. */
window.renderScene = function (key) {
  const fn = SCENES[key];
  if (!fn) throw new Error(`unknown scene ${key}`);
  ctx.clearRect(0, 0, W, H);
  fn();
  return cv.toDataURL('image/jpeg', 0.9);
};
window.SCENES = Object.keys(SCENES);
window.__samplesReady = true;
</script>
